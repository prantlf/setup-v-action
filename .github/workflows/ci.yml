name: Test or Release

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: latest
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'
    - run: pnpm ci
    - run: npm run build
    # - run: npm test
    - uses: ./
    - uses: ./
      with:
        use-cache: false
        force-build: true
        install-dependencies: false

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: latest
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'
    - run: pnpm ci
    - run: npm run build
    - run: npm test
    - uses: ./
    - uses: ./
      with:
        use-cache: false
        force-build: true
        install-dependencies: false

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
      with:
        version: latest
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'
    - run: pnpm ci
    - run: npm run build
    # - run: npm test
    - uses: ./
    # - uses: ./
    #   with:
    #     use-cache: false
    #     force-build: true
    #     install-dependencies: false
